version: '3.8'

services:
  translator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lsp_translator
    image: lsp-translator:latest
    
    privileged: true
    devices:
      - /dev/video0:/dev/video0  
    
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
    
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR}/pulse:${XDG_RUNTIME_DIR}/pulse:ro
      - ./data:/app/data
      - ./output:/app/output
      - ./models:/app/models
    
    network_mode: host
    
    stdin_open: true
    tty: true
    
    command: python start_main.py

  translator-simple:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lsp_translator_simple
    
    privileged: true
    devices:
      - /dev/video0:/dev/video0
    
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./data:/app/data
      - ./output:/app/output
    
    network_mode: host
    
    stdin_open: true
    tty: true
    
    command: python start_simple.py
    
    profiles:
      - simple

  translator-3d:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lsp_translator_3d
    
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./data:/app/data
      - ./output:/app/output
    
    network_mode: host
    
    stdin_open: true
    tty: true
    
    command: python start_text_to_sign.py
    
    profiles:
      - 3d

  blender:
    image: nytimes/blender:latest
    container_name: lsp_blender
    
    volumes:
      - .:/app
      - ./output:/app/output
      - ./scripts/blender:/app/scripts/blender
      - ./data:/app/data
    
    working_dir: /app
    
    command: blender --version
    
    profiles:
      - blender

volumes:
  data:
    driver: local
  output:
    driver: local
  models:
    driver: local
